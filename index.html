    if(hr==="high"&&ar==="high")return{score:"1-1",winner:"Draw",conf:"33%",rot:true,hRot:{cup:hp.cup,note:hp.rotNote},aRot:{cup:ap.cup,note:ap.rotNote},analysis:"DOUBLE ROTATION ALERT: Both "+H+" ("+hp.cup+") and "+A+" ("+ap.cup+") have major cup games. Both will rotate heavily.\n\n"+analysis};
    if(hr==="high"){const w=m.aP>40?A:"Draw";return{score:w===A?"0-1":"1-1",winner:w,conf:"42%",rot:true,hRot:{cup:hp.cup,note:hp.rotNote},analysis:"ROTATION ALERT — "+H+": "+hp.rotNote+"\n\n"+analysis};}
    if(ar==="high"){const w=m.hP>40?H:"Draw";return{score:w===H?"1-0":"1-1",winner:w,conf:"48%",rot:true,aRot:{cup:ap.cup,note:ap.rotNote},analysis:"ROTATION ALERT — "+A+": "+ap.rotNote+"\n\n"+analysis};}
    if(hr==="medium"||ar==="medium"){const rp=hr==="medium"?hp:ap,rT=hr==="medium"?H:A,c=Math.round(Math.max(m.hP,m.aP,m.dP)*0.85);const w=m.hP>m.aP?(m.hP>52?H:"Draw"):(m.aP>52?A:"Draw");return{score:w==="Draw"?"1-1":w===H?"1-0":"0-1",winner:w,conf:c+"%",rot:true,hRot:hr==="medium"?{cup:hp.cup,note:hp.rotNote}:null,aRot:ar==="medium"?{cup:ap.cup,note:ap.rotNote}:null,analysis:"Rotation caution — "+rT+": "+rp.rotNote+"\n\n"+analysis};}
  }
  let adjH=m.hP,adjA=m.aP;
  if(hf&&hf.filter(r=>r==="W").length>=4)adjH=Math.min(adjH+5,80);
  if(af&&af.filter(r=>r==="W").length>=4)adjA=Math.min(adjA+5,70);
  if(hs.length)adjH=Math.max(adjH-7,10);
  if(as_.length)adjA=Math.max(adjA-7,10);
  let winner,score;
  if(adjH>=58){winner=H;score="2-1";}else if(adjA>=58){winner=A;score="0-2";}else if(m.dP>=28&&Math.abs(adjH-adjA)<12){winner="Draw";score="1-1";}else if(adjH>adjA){winner=H;score="1-0";}else{winner=A;score="0-1";}
  return{score,winner,conf:Math.round(Math.max(adjH,adjA,m.dP))+"%",rot:false,analysis};
}

            :<div onClick={()=>setPaywallOpen(true)} style={{background:"linear-gradient(90deg,#00ff87,#00d4ff)",borderRadius:20,padding:"3px 10px",fontSize:10,fontWeight:900,color:"#000",cursor:"pointer"}}>Go Pro</div>}
            <div style={{display:"flex",alignItems:"center",gap:3}}><div style={{width:6,height:6,borderRadius:"50%",background:"#00ff87",animation:"pulse 2s infinite"}}/><span style={{fontSize:9,color:"#00ff87",fontWeight:700}}>LIVE</span></div>
            <button onClick={()=>setDrawer(true)} style={{background:"#ffffff0c",border:"1px solid #ffffff12",borderRadius:8,width:32,height:32,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:4,cursor:"pointer",flexShrink:0}}>
              {[0,1,2].map(i=><div key={i} style={{width:12,height:1.5,background:"#888",borderRadius:2}}/>)}
            </button>
          </div>
        </div>
        {tab==="home"&&(
          <>
            <div style={{display:"flex",alignItems:"center",gap:10,background:league.color+"18",border:"1px solid "+league.color+"33",borderRadius:12,padding:"7px 12px",marginBottom:10}}>
              <span style={{fontSize:18}}>{league.flag}</span>
              <div><div style={{fontSize:13,fontWeight:800}}>{league.name}</div><div style={{fontSize:10,color:"#666"}}>{matches.length} matches</div></div>
              <button onClick={()=>setDrawer(true)} style={{marginLeft:"auto",background:"#ffffff0c",border:"1px solid #ffffff15",borderRadius:8,padding:"4px 10px",fontSize:11,color:"#aaa",cursor:"pointer"}}>Switch ›</button>
            </div>
            <div style={{position:"relative",marginBottom:10}}>
              <span style={{position:"absolute",left:11,top:"50%",transform:"translateY(-50%)",color:"#444",fontSize:13}}>🔍</span>
              <input placeholder="Search teams..." value={search} onChange={e=>setSearch(e.target.value)} style={{width:"100%",background:"#ffffff07",border:"1px solid #ffffff10",borderRadius:10,padding:"8px 12px 8px 32px",color:"#fff",fontSize:13,outline:"none"}}/>
            </div>
          </>
        )}
      </div>

      {tab==="home"&&<div ref={ref} style={{flex:1,overflowY:"auto",padding:"10px 14px 80px"}}>{matches.length===0?<div style={{textAlign:"center",color:"#444",padding:"60px 0",fontSize:14}}>No matches found</div>:matches.map(m=><Card key={m.id} m={m} onPredict={doPredict} pred={preds[m.id]} loading={loading} lid={active} onFav={toggleFav} isFav={isFav}/>)}</div>}
      {tab==="favorites"&&<FavTab/>}
      {tab==="history"&&<HistTab/>}
      {tab==="profile"&&<ProfileTab/>}

      {tab==="home"&&(
        <div style={{position:"absolute",bottom:52,left:0,right:0,background:"linear-gradient(to top,#08080f 85%,transparent)",padding:"8px 0 4px"}}>
          <div style={{display:"flex",gap:5,overflowX:"auto",padding:"0 14px",scrollbarWidth:"none"}}>
            {LEAGUES.map(l=>(
              <button key={l.id} onClick={()=>doPick(l.id)} style={{background:active===l.id?l.color+"33":"#ffffff08",border:"1px solid "+(active===l.id?l.color:"#ffffff10"),borderRadius:20,padding:"5px 11px",fontSize:10,color:active===l.id?"#fff":"#666",cursor:"pointer",whiteSpace:"nowrap",fontWeight:active===l.id?800:400,flexShrink:0}}>
                {l.flag} {l.id.toUpperCase()}{!canAccess(l.id)?" 🔒":""}
              </button>
            ))}
          </div>
        </div>
      )}

      <div style={{position:"absolute",bottom:0,left:0,right:0,background:"#0d0d1a",borderTop:"1px solid #ffffff0f",height:52,display:"flex",alignItems:"center",zIndex:60}}>
        {[{id:"home",icon:"⚽",label:"Matches"},{id:"favorites",icon:"⭐",label:"Favorites"},{id:"history",icon:"📊",label:"My Picks"},{id:"profile",icon:user?user.avatar:"👤",label:user?user.name.split(" ")[0]:"Profile"}].map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:2,background:"none",border:"none",cursor:"pointer",padding:"4px 0"}}>
            <span style={{fontSize:tab===t.id?19:16}}>{t.icon}</span>
            <span style={{fontSize:9,color:tab===t.id?"#00ff87":"#444",fontWeight:tab===t.id?800:400}}>{t.label}</span>
            {tab===t.id&&<div style={{width:14,height:2,background:"#00ff87",borderRadius:1}}/>}
          </button>
        ))}
      </div>

      {paywallOpen&&(
        <div style={{position:"fixed",inset:0,zIndex:300,background:"#000000ee",backdropFilter:"blur(8px)",display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
          <div style={{width:"100%",maxWidth:480,background:"linear-gradient(180deg,#0d0d1a,#08080f)",borderRadius:"26px 26px 0 0",padding:"0 0 36px"}}>
            <div style={{width:"100%",height:3,background:"linear-gradient(90deg,transparent,#00ff87,transparent)",borderRadius:"3px 3px 0 0"}}/>
            <div style={{padding:"20px 22px 0",textAlign:"center"}}>
              <div style={{fontSize:30,marginBottom:5}}>🏆</div>
              <div style={{fontFamily:"monospace",fontSize:19,fontWeight:900,background:"linear-gradient(90deg,#00ff87,#00d4ff)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",marginBottom:4}}>MatchMind Pro</div>
              <div style={{fontSize:12,color:"#666",marginBottom:14}}>{inTrial?"Trial: "+trialDays+" days left":"Upgrade to continue"}</div>
            </div>
            <div style={{padding:"0 22px"}}>
              {["All 13 leagues + World Cup 2026","Unlimited AI predictions","14-factor deep analysis","Rotation risk intelligence","No ads ever"].map((f,i)=>(
                <div key={i} style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
                  <span style={{color:"#00ff87",fontSize:13}}>✓</span><span style={{fontSize:13,color:"#bbb"}}>{f}</span>
                </div>
              ))}
            </div>
            <div style={{padding:"14px 22px 0",display:"flex",gap:10}}>
              {[{id:"annual",l:"Best Value",p:"$29.99",per:"/year",s:"Save 50%",best:true},{id:"monthly",l:"Monthly",p:"$4.99",per:"/month",s:"Cancel anytime",best:false}].map(p=>(
                <div key={p.id} onClick={()=>setPlan(p.id)} style={{flex:1,border:"2px solid "+(plan===p.id?"#00ff87":"#ffffff15"),borderRadius:13,padding:"11px 8px",textAlign:"center",cursor:"pointer",background:plan===p.id?"#00ff8710":"#ffffff05",position:"relative"}}>
                  {p.best&&<div style={{position:"absolute",top:-9,left:"50%",transform:"translateX(-50%)",background:"linear-gradient(90deg,#00ff87,#00d4ff)",color:"#000",fontSize:9,fontWeight:900,padding:"2px 8px",borderRadius:20,whiteSpace:"nowrap"}}>BEST VALUE</div>}
                  <div style={{fontSize:9,color:"#666",letterSpacing:1,textTransform:"uppercase",marginBottom:3}}>{p.l}</div>
                  <div style={{fontSize:21,fontWeight:900,color:"#fff"}}>{p.p}</div>
                  <div style={{fontSize:10,color:"#555"}}>{p.per}</div>
                  <div style={{fontSize:9,color:"#00ff87",marginTop:2}}>{p.s}</div>
                </div>
              ))}
            </div>
            <div style={{padding:"13px 22px 0"}}>
              <button onClick={doSubscribe} style={{width:"100%",background:"linear-gradient(135deg,#00ff87,#00d4ff)",color:"#000",border:"none",borderRadius:12,padding:"14px",fontSize:14,fontWeight:900,cursor:"pointer",boxShadow:"0 4px 20px #00ff8750"}}>{plan==="annual"?"Start Pro — $29.99/year":"Start Pro — $4.99/month"}</button>
              {inTrial&&<button onClick={()=>setPaywallOpen(false)} style={{display:"block",width:"100%",marginTop:8,background:"transparent",border:"1px solid #ffffff10",borderRadius:10,padding:"10px",fontSize:12,color:"#555",cursor:"pointer"}}>Continue {trialDays}-day trial</button>}
              <div style={{textAlign:"center",marginTop:10,fontSize:10,color:"#333",lineHeight:1.7}}>Billed via App Store or Google Play · Cancel anytime<br/><span style={{color:"#ff6b35"}}>For entertainment only · Not gambling advice</span></div>
              <button onClick={()=>setPaywallOpen(false)} style={{display:"block",margin:"8px auto 0",background:"none",border:"none",color:"#333",fontSize:12,cursor:"pointer"}}>Maybe later</button>
            </div>
          </div>
        </div>
      )}

      {drawer&&(
        <div style={{position:"absolute",inset:0,zIndex:100}}>
          <div onClick={()=>setDrawer(false)} style={{position:"absolute",inset:0,background:"#000000bb",backdropFilter:"blur(4px)"}}/>
          <div style={{position:"absolute",bottom:0,left:0,right:0,background:"#111118",borderRadius:"20px 20px 0 0",padding:"0 0 40px",animation:"slideUp .3s cubic-bezier(.4,0,.2,1)",maxHeight:"85vh",overflowY:"auto"}}>
            <div style={{display:"flex",justifyContent:"center",padding:"12px 0 6px"}}><div style={{width:40,height:4,background:"#333",borderRadius:2}}/></div>
            <div style={{padding:"8px 20px 14px",fontSize:16,fontWeight:800}}>Select League</div>
            {LEAGUES.map(l=>(
              <button key={l.id} onClick={()=>doPick(l.id)} style={{display:"flex",alignItems:"center",gap:14,width:"100%",background:active===l.id?l.color+"18":"transparent",border:"none",borderLeft:active===l.id?"3px solid "+l.color:"3px solid transparent",padding:"13px 20px",cursor:"pointer",textAlign:"left"}}>
                <span style={{fontSize:22}}>{l.flag}</span>
                <div><div style={{fontSize:14,fontWeight:700,color:active===l.id?"#fff":"#aaa"}}>{l.name}</div><div style={{fontSize:11,color:"#555"}}>{(MATCHES[l.id]||[]).length} matches</div></div>
                {!canAccess(l.id)&&<span style={{marginLeft:"auto",fontSize:11,color:"#555"}}>🔒 Pro</span>}
                {active===l.id&&canAccess(l.id)&&<span style={{marginLeft:"auto",color:l.color,fontSize:16}}>✓</span>}
              </button>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}


const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(MatchMind));
</script>
</body>
</html>
