function getRot(a){const p=PROFILES[a];if(!p||!p.cup)return null;return p.rot>=0.75?"high":p.rot>=0.35?"medium":null;}

function predict(m,isCup){
  const H=m.home,A=m.away,hA=m.hA,aA=m.aA;
  const hp=PROFILES[hA]||{},ap=PROFILES[aA]||{};
  // FIX (Bug C): Prefer live form from standings API, fall back to hardcoded
  const hf=(window.MM_FORM && window.MM_FORM[hA]) || FORM[hA];
  const af=(window.MM_FORM && window.MM_FORM[aA]) || FORM[aA];
  const hs=SUSP[hA]||[],as_=SUSP[aA]||[];
  const lines=[];
  if(hf)lines.push("📊 "+H+" last 5: "+hf.join("-"));
  if(af)lines.push("📊 "+A+" last 5: "+af.join("-"));
  
  
  if(hp.morale)lines.push("😤 "+H+" morale: "+hp.morale);
  if(!isCup&&hp.won)lines.push("🏆 "+H+" won the league — rotating for UCL");
  // WC FACTOR ANALYSIS
  if(!isCup && m.wcZone){
    const daysOut = m.wcDaysOut || 0;
    const homeWCHigh = m.wcHome >= 60;
    const awayWCHigh = m.wcAway >= 60;
    if(homeWCHigh && awayWCHigh){
      lines.push("🌍 WC CAUTION: Both teams have many WC-bound players ("+daysOut+" days to World Cup). Expect cautious play, lower-scoring affair.");
    } else if(homeWCHigh){
      lines.push("🌍 WC CAUTION: "+H+" has many WC-bound players ("+daysOut+" days to World Cup). May play conservatively to avoid injuries — advantage "+A+".");
    } else if(awayWCHigh){
      lines.push("🌍 WC CAUTION: "+A+" has many WC-bound players ("+daysOut+" days to World Cup). May play conservatively to avoid injuries — advantage "+H+".");
    }
  }
  const analysis=lines.join("\n");
  if(!isCup){
    const hr=getRot(hA),ar=getRot(aA);
    if(hr==="high"&&ar==="high")return{score:"1-1",winner:"Draw",conf:"33%",rot:true,hRot:{cup:hp.cup,note:hp.rotNote},aRot:{cup:ap.cup,note:ap.rotNote},analysis:"DOUBLE ROTATION ALERT: Both "+H+" ("+hp.cup+") and "+A+" ("+ap.cup+") have major cup games. Both will rotate heavily.\n\n"+analysis};
    if(hr==="high"){const w=m.aP>40?A:"Draw";return{score:w===A?"0-1":"1-1",winner:w,conf:"42%",rot:true,hRot:{cup:hp.cup,note:hp.rotNote},analysis:"ROTATION ALERT — "+H+": "+hp.rotNote+"\n\n"+analysis};}
    if(ar==="high"){const w=m.hP>40?H:"Draw";return{score:w===H?"1-0":"1-1",winner:w,conf:"48%",rot:true,aRot:{cup:ap.cup,note:ap.rotNote},analysis:"ROTATION ALERT — "+A+": "+ap.rotNote+"\n\n"+analysis};}
    if(hr==="medium"||ar==="medium"){const rp=hr==="medium"?hp:ap,rT=hr==="medium"?H:A,c=Math.round(Math.max(m.hP,m.aP,m.dP)*0.85);const w=m.hP>m.aP?(m.hP>52?H:"Draw"):(m.aP>52?A:"Draw");return{score:w==="Draw"?"1-1":w===H?"1-0":"0-1",winner:w,conf:c+"%",rot:true,hRot:hr==="medium"?{cup:hp.cup,note:hp.rotNote}:null,aRot:ar==="medium"?{cup:ap.cup,note:ap.rotNote}:null,analysis:"Rotation caution — "+rT+": "+rp.rotNote+"\n\n"+analysis};}
  }
  let adjH=m.hP,adjA=m.aP;
  if(hf&&hf.filter(r=>r==="W").length>=4)adjH=Math.min(adjH+5,80);
  if(af&&af.filter(r=>r==="W").length>=4)adjA=Math.min(adjA+5,70);
  if(hs.length)adjH=Math.max(adjH-7,10);
  if(as_.length)adjA=Math.max(adjA-7,10);
  let winner,score;
  if(adjH>=58){winner=H;score="2-1";}else if(adjA>=58){winner=A;score="0-2";}else if(m.dP>=28&&Math.abs(adjH-adjA)<12){winner="Draw";score="1-1";}else if(adjH>adjA){winner=H;score="1-0";}else{winner=A;score="0-1";}
  return{score,winner,conf:Math.round(Math.max(m.hP,m.aP,m.dP))+"%",rot:false,analysis};
}

// ── CONFIDENCE LEVEL HELPER ────────────────────────────────────────
function getConfidenceLevel(m) {
  const max = Math.max(m.hP, m.aP, m.dP);
  if (max >= 65) return { level: "HIGH", color: "#00ff87", icon: "🟢", label: "High Confidence" };
  if (max >= 45) return { level: "MEDIUM", color: "#ffd60a", icon: "🟡", label: "Medium Confidence" };
  return { level: "LOW", color: "#ff6b35", icon: "🔴", label: "Low Confidence — Coin Flip" };
}

// ── RISK TAG HELPER ─────────────────────────────────────────────────
function getRiskTag(m, isCup) {
  const max = Math.max(m.hP, m.aP);
  const diff = Math.abs(m.hP - m.aP);
  if (!isCup) {
    const hr = getRot(m.hA), ar = getRot(m.aA);
    if (hr === "high" || ar === "high") return { tag: "ROTATION RISK", color: "#ff6b35", icon: "🔄" };
  }
  // WC CAUTION takes priority for non-cup pre-WC matches
  if (!isCup && m.wcZone && (m.wcHome >= 60 || m.wcAway >= 60)) {
    return { tag: "WC CAUTION", color: "#ffd60a", icon: "🌍" };
  }
  if (max >= 70) return { tag: "SAFE PICK", color: "#00ff87", icon: "✅" };
  if (m.dP >= 28 && diff < 10) return { tag: "COIN FLIP", color: "#ffd60a", icon: "⚖️" };
  if (max < 50) return { tag: "UPSET ALERT", color: "#ff6b35", icon: "⚠️" };
  return { tag: "STANDARD", color: "#00d4ff", icon: "📊" };
}

// Fetch finished fixture result to update prediction accuracy
async function fetchFixtureResult(fixtureId) {
  if (!fixtureId) return null;
  try {
    const url = BACKEND_URL + "/fixtures?id=" + fixtureId;
    const res = await fetch(url);
    if (!res.ok) return null;
    const data = await res.json();
    const fix = data.response && data.response[0];
    if (!fix || !fix.fixture || fix.fixture.status.short !== "FT") return null;
    const home = fix.teams.home;
    const away = fix.teams.away;
    const hG = fix.goals.home || 0;
    const aG = fix.goals.away || 0;
    let winner = "Draw";
    if (hG > aG) winner = home.name;
    else if (aG > hG) winner = away.name;
    return { finished: true, winner, score: hG + "-" + aG };
  } catch(e) {
    return null;
  }
}

async function fetchStandings(leagueId) {
  if (!leagueId) return null;
  try {
    const url = BACKEND_URL + "/standings?league=" + leagueId + "&season=" + BACKEND_SEASON;
    const res = await fetch(url);
    if (!res.ok) return null;
    const data = await res.json();
    const response = data.response && data.response[0];
    if (!response || !response.league || !response.league.standings) return null;
    const standingsList = response.league.standings[0]; // First standings group
    // FIX (Bug C): Populate window.MM_FORM from real standings data
    // Each standing has team.name and form like "WWWWL"
    if (standingsList && Array.isArray(standingsList)) {
      if (!window.MM_FORM) window.MM_FORM = {};
      standingsList.forEach(s => {
        if (s.team && s.team.name && s.form && typeof abbr === 'function') {
          // Parse form string "WWWWL" into array, take last 5
          const formArr = s.form.split('').slice(-5);
          if (formArr.length > 0) {
            window.MM_FORM[abbr(s.team.name)] = formArr;
          }
        }
      });
      try { localStorage.setItem("mm_form_v1", JSON.stringify(window.MM_FORM)); } catch(e) {}
    }
    return standingsList;
  } catch(e) {
    return null;
  }
}

async function fetchH2H(homeId, awayId) {
  if (!homeId || !awayId) return null;
  try {
    const url = BACKEND_URL + "/h2h?team1=" + homeId + "&team2=" + awayId + "&last=5";
    const res = await fetch(url);
    if (!res.ok) return null;
    const data = await res.json();
    return data.response || [];
  } catch(e) {
    return null;
  }
}

async function fetchWeather(m) {
  try {
    // Find stadium coords from home team
    const coords = STADIUM_COORDS[m.home];
    if (!coords) return null;
    const [lat, lng] = coords;
    // Use Open-Meteo (free, no API key)
    const url = "https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lng + "&current=temperature_2m,precipitation,wind_speed_10m&forecast_days=1";
    const res = await fetch(url);
    if (!res.ok) return null;
    const data = await res.json();
    if (!data.current) return null;
    const temp = Math.round(data.current.temperature_2m);
    const precip = data.current.precipitation || 0;
    const wind = Math.round(data.current.wind_speed_10m || 0);
    // Determine main condition
    let condition = null;
    if (precip > 2) condition = "rain";
    else if (wind > 30) condition = "wind";
    else if (temp > 28) condition = "heat";
    else if (temp < 5) condition = "cold";
    return { temp, precip, wind, condition };
  } catch(e) {
    return null;
  }
}

async function fetchBackendFixtures(leagueId) {
  const apiLeagueId = LEAGUE_IDS[leagueId];
  if (!apiLeagueId) return null;
  // Try current season first, then next season for off-season cups
  const seasons = [BACKEND_SEASON, "2026", "2024"];
  for (const season of seasons) {
    try {
      const url = BACKEND_URL + "/fixtures?league=" + apiLeagueId + "&season=" + season;
      const res = await fetch(url);
      if (!res.ok) continue;
      const data = await res.json();
      if (data.response && data.response.length > 0) {
        // Filter for upcoming or recent (last 2 days to next 60 days for cups/finals)
        const now = new Date();
        const recent = data.response.filter(fix => {
          if (!fix.fixture || !fix.fixture.date) return false;
          const fd = new Date(fix.fixture.date);
          const diff = (fd - now) / (1000 * 60 * 60 * 24);
          return diff > -0.1 && diff < 60; // hide ~2.4 hrs after kickoff
        });
        if (recent.length > 0) return recent;
      }
    } catch(e) {
      console.log("Season " + season + " failed:", e.message);
    }
  }
  return null;
}

// Convert API-Football fixture to our app format
function convertFixtureToMatch(fix, leagueId) {
  if (!fix || !fix.fixture || !fix.teams) return null;
  const home = fix.teams.home;
  const away = fix.teams.away;
  const dateObj = new Date(fix.fixture.date);
  const now = new Date();
  // Only show upcoming fixtures (within next 60 days) or recent
  const daysDiff = (dateObj - now) / (1000 * 60 * 60 * 24);
  if (daysDiff < -0.1 || daysDiff > 60) return null; // hide ~2.4 hrs after kickoff
  
  const dateStr = dateObj.toLocaleDateString("en-US", {weekday:"short", month:"short", day:"numeric"});
  const timeStr = dateObj.toLocaleTimeString("en-US", {hour:"numeric", minute:"2-digit", hour12:true, timeZone:"America/New_York"}) + " EDT";
  
  // Use API-Football logos if available, otherwise fall back
  const homeLogo = home.logo;
  const awayLogo = away.logo;
  
  // Generate 3-letter abbreviations from team names
  const abbr = (name) => {
    const words = name.split(" ");
    if (words.length === 1) return name.substring(0,3).toUpperCase();
    return words.map(w => w[0]).join("").substring(0,3).toUpperCase();
  };
  
  // Calculate probabilities based on team strength tiers
  // 🤖 DATA-DRIVEN: Uses real win rates from last 3 seasons via backend
  // 📊 FALLBACK: Hardcoded values used only when backend hasn't loaded yet
  const TEAM_TIER = {
    "Manchester City": 90, "Liverpool": 90, "Real Madrid": 92, "Barcelona": 90,
    "Bayern Munich": 92, "Bayern München": 92, "Paris Saint Germain": 90, "PSG": 90,
    "Inter": 88, "Inter Milan": 88, "Arsenal": 88, "Chelsea": 82, "Manchester United": 80,
    "Tottenham": 82, "Atletico Madrid": 82, "Atlético Madrid": 82, "Juventus": 80,
    "AC Milan": 80, "Napoli": 82, "Borussia Dortmund": 82, "Bayer Leverkusen": 84,
    "RB Leipzig": 78, "Marseille": 76, "Monaco": 76, "PSV": 76, "PSV Eindhoven": 76,
    "Ajax": 76, "Newcastle": 78, "Aston Villa": 76, "Roma": 78, "Lazio": 76,
    "Brighton": 70, "West Ham": 70, "Crystal Palace": 70, "Brentford": 68,
    "Nottingham Forest": 68, "Fulham": 68, "Bournemouth": 66, "Everton": 64,
    "Sevilla": 70, "Real Sociedad": 72, "Athletic Bilbao": 72, "Real Betis": 70,
    "Villarreal": 72, "Valencia": 66, "Girona": 70, "Eintracht Frankfurt": 72,
    "Stuttgart": 72, "Wolfsburg": 68, "Atalanta": 76, "Bologna": 70, "Fiorentina": 72,
    "Torino": 64, "Como": 62, "Lyon": 72, "Lille": 72, "Nice": 70, "Lens": 68,
    "Rennes": 68, "Feyenoord": 74, "AZ Alkmaar": 70, "Mainz": 64, "Augsburg": 60,
    "Werder Bremen": 60, "Heidenheim": 58, "Cagliari": 58, "Empoli": 58, "Lecce": 56,
    "Sassuolo": 56, "Parma": 58, "Monza": 58, "Strasbourg": 62, "Toulouse": 60,
    "Nantes": 58, "Reims": 60, "Brest": 64, "Auxerre": 58,
    "Germany": 88, "France": 90, "Spain": 88, "England": 86, "Brazil": 90,
    "Argentina": 92, "Portugal": 86, "Italy": 84, "Netherlands": 84, "Croatia": 80,
    "Mexico": 70, "USA": 72, "Canada": 66, "Japan": 76, "Korea": 72, "Morocco": 76
  };
  
  // Look up team strength: prefer real data from backend, fallback to hardcoded
  const lookupStrength = (teamName) => {
    if (!teamName) return 60;
    // Check if we have real data from backend (window.MM_STRENGTHS is populated by backend fetch)
    if (window.MM_STRENGTHS && window.MM_STRENGTHS[teamName]) {
      return window.MM_STRENGTHS[teamName].strength;
    }
    // Fallback to hardcoded
    return TEAM_TIER[teamName] || 60;
  };
  
  const homeStrength = lookupStrength(home.name);
  const awayStrength = lookupStrength(away.name);
  const diff = (homeStrength + 5) - awayStrength;
  let hP, aP, dP;
  if (diff >= 25) { hP = 75; aP = 10; dP = 15; }
  else if (diff >= 15) { hP = 65; aP = 15; dP = 20; }
  else if (diff >= 8) { hP = 55; aP = 22; dP = 23; }
  else if (diff >= 3) { hP = 48; aP = 28; dP = 24; }
  else if (diff >= -3) { hP = 40; aP = 35; dP = 25; }
  else if (diff >= -8) { hP = 32; aP = 45; dP = 23; }
  else if (diff >= -15) { hP = 22; aP = 58; dP = 20; }
  else if (diff >= -25) { hP = 14; aP = 70; dP = 16; }
  else { hP = 8; aP = 78; dP = 14; }
  // FIX: removed random fixture-ID seed so predictions are deterministic
  // Same match must always show the same probabilities regardless of session
  dP = 100 - hP - aP;

  
  // WC FACTOR: Percentage of likely starting XI heading to World Cup 2026
  // Higher = team more likely to play cautiously to avoid pre-WC injuries
  // Top federations with confirmed WC qualification + strong league presence
  const WC_FACTOR = {
    // ENGLISH - England qualified, many Premier League players
    "Manchester City": 80, "Liverpool": 75, "Arsenal": 80, "Tottenham": 70,
    "Manchester United": 60, "Chelsea": 65, "Newcastle": 55, "Aston Villa": 50,
    "Brighton": 35, "West Ham": 40, "Crystal Palace": 35,
    // SPANISH - Spain qualified
    "Real Madrid": 85, "Barcelona": 80, "Atletico Madrid": 70, "Atlético Madrid": 70,
    "Athletic Bilbao": 55, "Real Sociedad": 50, "Sevilla": 35, "Villarreal": 40,
    // GERMAN - Germany qualified
    "Bayern Munich": 85, "Bayern München": 85, "Borussia Dortmund": 75,
    "Bayer Leverkusen": 70, "RB Leipzig": 65, "Eintracht Frankfurt": 50, "Stuttgart": 55,
    // FRENCH - France qualified
    "Paris Saint Germain": 85, "PSG": 85, "Marseille": 55, "Monaco": 60,
    "Lyon": 50, "Lille": 45, "Nice": 35,
    // ITALIAN - Italy DID NOT qualify, but their clubs have many other nationalities
    "Inter": 65, "Inter Milan": 65, "Juventus": 60, "AC Milan": 60,
    "Napoli": 55, "Roma": 50, "Lazio": 45, "Atalanta": 50, "Fiorentina": 35,
    // PORTUGUESE - Portugal qualified
    "Benfica": 60, "Porto": 55, "FC Porto": 55, "Sporting CP": 60,
    // DUTCH - Netherlands qualified
    "Ajax": 60, "PSV": 65, "PSV Eindhoven": 65, "Feyenoord": 55,
    // BRAZILIAN, ARGENTINIAN players spread across all top leagues - already factored in
  };
  
  const homeWC = WC_FACTOR[home.name] || 25; // default 25% for any team (assume some international players)
  const awayWC = WC_FACTOR[away.name] || 25;
  
  // Check if we're in WC danger zone (before June 11, 2026)
  const wcStart = new Date("2026-06-11");
  const matchDate = new Date(fix.fixture.date);
  const daysToWC = (wcStart - matchDate) / (1000 * 60 * 60 * 24);
  const inWCZone = daysToWC > 0 && daysToWC < 35; // 5 weeks before WC
  
  // Apply WC factor: reduce probability for team with more WC players
  // The more WC-bound, the more cautious they play
  if (inWCZone) {
    // Reduce home win % proportional to homeWC, give to draw + away
    const homeReduction = Math.floor((homeWC - 25) / 10); // up to ~6% reduction
    const awayReduction = Math.floor((awayWC - 25) / 10);
    
    // Net effect: more WC players on home = home loses %, away gains
    const netShift = homeReduction - awayReduction;
    if (netShift > 0) {
      hP = Math.max(5, hP - netShift);
      aP = Math.min(85, aP + Math.floor(netShift * 0.6));
      dP = 100 - hP - aP;
    } else if (netShift < 0) {
      aP = Math.max(5, aP + netShift); // netShift is negative
      hP = Math.min(85, hP + Math.floor(-netShift * 0.6));
      dP = 100 - hP - aP;
    }
  }
  
  // Travel Fatigue Calculation - based on date proximity to other matches
  // We don't fetch here (sync function), but mark for lazy fetch later
  // For now, simple proxy: if match is on weekend after a Tuesday/Wednesday (UCL/UEL day)
  const dayOfWeek = dateObj.getDay(); // 0=Sun, 6=Sat
  const isWeekendMatch = dayOfWeek === 0 || dayOfWeek === 6;
  // We'll let the predict function check actual recent fixtures
  
  return {
    id: "api_" + fix.fixture.id,
    home: home.name,
    away: away.name,
    hA: abbr(home.name),
    aA: abbr(away.name),
    homeTeamId: home.id,    // for fetching real injuries
    awayTeamId: away.id,    // for fetching real injuries
    date: dateStr,
    time: timeStr,
    hP, aP, dP,
    homeLogo, awayLogo,
    fixtureId: fix.fixture.id,
    isLive: fix.fixture.status.short === "1H" || fix.fixture.status.short === "2H" || fix.fixture.status.short === "HT",
    backend: true,
    wcZone: inWCZone, // are we in WC pre-tournament window?
    wcHome: homeWC,    // % of home team going to WC
    wcAway: awayWC,    // % of away team going to WC
    wcDaysOut: inWCZone ? Math.floor(daysToWC) : null,
  };
}

// Get the Monday of the current week (used as a "week key" so picks lock for 7 days)
function getCurrentWeekKey() {
  const now = new Date();
  const day = now.getDay(); // 0=Sun, 1=Mon, ..., 6=Sat
  const daysToMonday = day === 0 ? 6 : day - 1;
  const monday = new Date(now);
  monday.setDate(now.getDate() - daysToMonday);
  monday.setHours(0, 0, 0, 0);
  return monday.toISOString().split('T')[0]; // "2026-05-04"
}

// Top picks for THIS WEEK only — locks Monday, resets next Monday
function getTop3Picks(activeLeague, backendFixtures) {
  const allMatches = [];
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  // Show picks for next 7 days starting today, refreshes daily
  const weekStart = new Date(today);
  const weekEnd = new Date(today);
  weekEnd.setDate(today.getDate() + 7);
  
  // PRIORITY: backend fixtures (real-time) over hardcoded
  const TOP_LEAGUES = ["epl", "ll", "bun", "sa", "l1", "ucl", "el"];
  
  TOP_LEAGUES.forEach(lid => {
    // Get fixtures from backend if available
    const source = (backendFixtures && backendFixtures[lid]) || MATCHES[lid] || [];
    source.forEach(m => {
      // Date check - only THIS WEEK's matches
      if (m.date) {
        try {
          const md = new Date(m.date + " " + today.getFullYear());
          if (isNaN(md.getTime())) return;
          if (md < weekStart || md > weekEnd) return;
        } catch(e) { return; }
      }
      
      const max = Math.max(m.hP || 0, m.aP || 0);
      const isCup = ["ucl", "el", "ecl"].includes(lid);
      
      // Only show high confidence (60%+) picks
      if (max >= 60) {
        let score = max;
        if (isCup) score += 10; // boost cup matches
        // Penalize rotation risk for non-cup matches
        if (!isCup) {
          const hr = getRot(m.hA), ar = getRot(m.aA);
          if (hr === "high" || ar === "high") score -= 30;
        }
        allMatches.push({ ...m, leagueId: lid, score, isCup });
      }
    });
  });
  
  return allMatches.sort((a, b) => b.score - a.score).slice(0, 3);
}

async function sharePrediction(m, pred) {
  if (!m || !pred) return;
  try {
    const canvas = document.createElement('canvas');
    canvas.width = 1080;
    canvas.height = 1350; // Instagram portrait ratio 4:5
    const ctx = canvas.getContext('2d');
    
    // Background gradient
    const bgGrad = ctx.createLinearGradient(0, 0, 0, 1350);
    bgGrad.addColorStop(0, '#0d0d1a');
    bgGrad.addColorStop(1, '#08080f');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, 1080, 1350);
    
    // Top accent bar
    const topGrad = ctx.createLinearGradient(0, 0, 1080, 0);
    topGrad.addColorStop(0, '#00ff87');
    topGrad.addColorStop(1, '#00d4ff');
    ctx.fillStyle = topGrad;
    ctx.fillRect(0, 0, 1080, 8);
    
    // MatchMind logo/header
    ctx.fillStyle = '#00ff87';
    ctx.font = 'bold 56px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('MatchMind', 540, 110);
    
    ctx.fillStyle = '#555';
    ctx.font = '20px -apple-system, sans-serif';
    ctx.fillText('BEYOND STATS. BEYOND LUCK.', 540, 145);
    
    // Pick badge
    ctx.fillStyle = '#00ff8722';
    ctx.strokeStyle = '#00ff87';
    ctx.lineWidth = 2;
    const badgeW = 220, badgeH = 50;
    const badgeX = (1080 - badgeW) / 2;
    const badgeY = 190;
    ctx.beginPath();
    ctx.roundRect(badgeX, badgeY, badgeW, badgeH, 25);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#00ff87';
    ctx.font = 'bold 22px -apple-system, sans-serif';
    ctx.fillText('🎯 TODAY\'S PICK', 540, badgeY + 33);
    
    // Match teams
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 60px -apple-system, sans-serif';
    const homeName = m.home.length > 16 ? m.home.substring(0, 16) : m.home;
    const awayName = m.away.length > 16 ? m.away.substring(0, 16) : m.away;
    ctx.fillText(homeName, 540, 360);
    
    ctx.fillStyle = '#666';
    ctx.font = '36px -apple-system, sans-serif';
    ctx.fillText('vs', 540, 425);
    
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 60px -apple-system, sans-serif';
    ctx.fillText(awayName, 540, 495);
    
    // Match date
    ctx.fillStyle = '#888';
    ctx.font = '24px -apple-system, sans-serif';
    ctx.fillText((m.date || '') + ' · ' + (m.time || ''), 540, 545);
    
    // Probability bar
    const barY = 620;
    const barH = 24;
    const barW = 900;
    const barX = (1080 - barW) / 2;
    const hPct = m.hP / 100;
    const dPct = m.dP / 100;
    
    // Home bar (blue)
    ctx.fillStyle = '#3b82f6';
    ctx.beginPath();
    ctx.roundRect(barX, barY, barW * hPct, barH, [12, 0, 0, 12]);
    ctx.fill();
    
    // Draw bar (gray middle)
    ctx.fillStyle = '#444';
    ctx.fillRect(barX + barW * hPct, barY, barW * dPct, barH);
    
    // Away bar (yellow/orange)
    ctx.fillStyle = '#ffd60a';
    ctx.beginPath();
    ctx.roundRect(barX + barW * (hPct + dPct), barY, barW * (1 - hPct - dPct), barH, [0, 12, 12, 0]);
    ctx.fill();
    
    // Probability labels
    ctx.fillStyle = '#3b82f6';
    ctx.font = 'bold 32px -apple-system, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(m.hA + ' ' + m.hP + '%', barX, barY + barH + 50);
    
    ctx.fillStyle = '#888';
    ctx.textAlign = 'center';
    ctx.fillText('Draw ' + m.dP + '%', 540, barY + barH + 50);
    
    ctx.fillStyle = '#ffd60a';
    ctx.textAlign = 'right';
    ctx.fillText(m.aA + ' ' + m.aP + '%', barX + barW, barY + barH + 50);
    
    // Main prediction box
    const boxY = 780;
    const boxH = 200;
    const boxW = 900;
    const boxX = (1080 - boxW) / 2;
    
    const boxGrad = ctx.createLinearGradient(boxX, boxY, boxX + boxW, boxY);
    boxGrad.addColorStop(0, '#00ff8722');
    boxGrad.addColorStop(1, '#00d4ff22');
    ctx.fillStyle = boxGrad;
    ctx.beginPath();
    ctx.roundRect(boxX, boxY, boxW, boxH, 20);
    ctx.fill();
    ctx.strokeStyle = '#00ff8755';
    ctx.lineWidth = 2;
    ctx.stroke();
    
    // Prediction text
    ctx.fillStyle = '#666';
    ctx.font = 'bold 22px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('AI PICK', 540, boxY + 45);
    
    ctx.fillStyle = '#00ff87';
    ctx.font = 'bold 56px -apple-system, sans-serif';
    const winnerShort = pred.winner.length > 18 ? pred.winner.substring(0, 18) : pred.winner;
    ctx.fillText(winnerShort, 540, boxY + 110);
    
    ctx.fillStyle = '#ffd60a';
    ctx.font = 'bold 28px -apple-system, sans-serif';
    ctx.fillText('Score: ' + pred.score + '   ·   Confidence: ' + pred.conf, 540, boxY + 165);
    
    // Risk tags
    const tagY = 1020;
    let tagX = 100;
    const tagsToShow = [];
    if (pred.fatigueTag) tagsToShow.push({ text: '🚌 FATIGUED', color: '#ff9a3c' });
    if (pred.h2hTag === 'DOMINANCE') tagsToShow.push({ text: '🤝 DOMINANCE', color: '#00ff87' });
    if (pred.h2hTag === 'BOGEY') tagsToShow.push({ text: '😱 BOGEY TEAM', color: '#ff4757' });
    if (pred.weatherTag === 'RAIN') tagsToShow.push({ text: '☔ RAIN', color: '#4dabf7' });
    if (pred.weatherTag === 'WIND') tagsToShow.push({ text: '🌬️ WINDY', color: '#74c0fc' });
    if (pred.stakesTag === 'TITLE') tagsToShow.push({ text: '👑 TITLE RACE', color: '#ffd60a' });
    if (pred.stakesTag === 'CHAMPION') tagsToShow.push({ text: '🏆 CHAMPIONS', color: '#ffd60a' });
    if (pred.stakesTag === 'UCL') tagsToShow.push({ text: '🏆 UCL RACE', color: '#00d4ff' });
    if (pred.stakesTag === 'REL' || pred.stakesTag === 'REL6') tagsToShow.push({ text: '🔥 RELEGATION', color: '#ff6b35' });
    
    if (tagsToShow.length > 0) {
      ctx.fillStyle = '#666';
      ctx.font = 'bold 20px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('KEY FACTORS', 540, 1030);
      
      // Center the tags
      ctx.font = 'bold 26px -apple-system, sans-serif';
      const tagSpacing = 30;
      const tagBoxes = tagsToShow.slice(0, 3); // Max 3 tags
      const totalWidth = tagBoxes.reduce((sum, t) => sum + ctx.measureText(t.text).width + 60, 0) + (tagBoxes.length - 1) * tagSpacing;
      let curX = (1080 - totalWidth) / 2;
      
      tagBoxes.forEach(tag => {
        const w = ctx.measureText(tag.text).width + 60;
        ctx.fillStyle = tag.color + '22';
        ctx.beginPath();
        ctx.roundRect(curX, 1055, w, 50, 12);
        ctx.fill();
        ctx.strokeStyle = tag.color + '55';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = tag.color;
        ctx.textAlign = 'center';
        ctx.fillText(tag.text, curX + w/2, 1090);
        curX += w + tagSpacing;
      });
    }
    
    // Footer
    ctx.fillStyle = '#00ff87';
    ctx.font = 'bold 28px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('matchmindhq.com', 540, 1220);
    
    ctx.fillStyle = '#555';
    ctx.font = '18px -apple-system, sans-serif';
    ctx.fillText('For entertainment only · Not gambling advice', 540, 1255);
    
    // Convert to blob and share
    canvas.toBlob(async (blob) => {
      if (!blob) return;
      const file = new File([blob], 'matchmind-pick.png', { type: 'image/png' });
      // Try native share API first (mobile)
      if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: 'My MatchMind Pick',
            text: 'My MatchMind AI pick: ' + pred.winner + ' to win! 🎯 Get yours at matchmindhq.com'
          });
          return;
        } catch (e) {
          // User canceled or share failed - fall through to download
        }
      }
      // Fallback: download the image
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'matchmind-' + m.hA + '-vs-' + m.aA + '.png';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }, 'image/png');
  } catch (e) {
    console.log('Share failed:', e.message);
    alert('Sharing failed. Please try again.');
  }
}

  useEffect(() => {

  // tab change, or manual button)
  const checkPendingResults = async (showFeedback = false) => {
    const pending = history.filter(h => h.correct === null && h.fixtureId);
    if (pending.length === 0) {
      if (showFeedback) {
        setLastCheckMsg("No pending predictions with fixture IDs to check");
        setTimeout(() => setLastCheckMsg(""), 3000);
      }
      return 0;
    }
    if (showFeedback) setCheckingResults(true);
    let updated = false;
    let updatedCount = 0;
    const newHistory = [...history];
    for (const entry of pending) {
      // Only check entries older than 90 min (avg game length)
      const elapsedMin = (Date.now() - entry.id) / (1000 * 60);
      if (elapsedMin < 90) continue;
      const result = await fetchFixtureResult(entry.fixtureId);
      if (result && result.finished) {
        const idx = newHistory.findIndex(h => h.id === entry.id);
        if (idx >= 0) {
          // Map prediction winner to compare (entry.prediction is hA or aA or "Draw")
          const predictedHome = entry.prediction === entry.hA || entry.prediction === entry.home;
          const predictedAway = entry.prediction === entry.aA || entry.prediction === entry.away;
          const predictedDraw = entry.prediction === "Draw" || entry.prediction === "DRAW";
          const actualHome = result.winner === entry.home;
          const actualAway = result.winner === entry.away;
          const actualDraw = result.winner === "Draw";
          const wasCorrect = (predictedHome && actualHome) || (predictedAway && actualAway) || (predictedDraw && actualDraw);
          newHistory[idx] = { ...entry, correct: wasCorrect, actualScore: result.score };
          updated = true;
          updatedCount++;
        }
      }
    }
    if (updated) {
      setHistory(newHistory);
      try { localStorage.setItem("mm_history", JSON.stringify(newHistory)); } catch {}
    }
    if (showFeedback) {
      setCheckingResults(false);
      if (updatedCount > 0) {
        setLastCheckMsg("Updated " + updatedCount + " prediction" + (updatedCount > 1 ? "s" : ""));
      } else {
        setLastCheckMsg("No new results yet — matches may still be in progress");
      }
      setTimeout(() => setLastCheckMsg(""), 4000);
    }
    return updatedCount;
  };

  useEffect(() => {
    checkPendingResults();
    const interval = setInterval(() => checkPendingResults(), 30 * 60 * 1000); // every 30 min
    return () => clearInterval(interval);
  }, [history.length]);

  // FIX: Auto-run result checker when "My Picks" tab is opened
  useEffect(() => {
    if (tab === "history") {
      checkPendingResults();
    }
  }, [tab]);

  const trialDays=Math.max(0,7-Math.floor((Date.now()-trialStart)/86400000));
  const inTrial=trialDays>0;
  const canPredict=isPro||inTrial;
  const canAccess=lid=>isPro||inTrial;
  const league=LEAGUES.find(l=>l.id===active);
  // Use backend fixtures if available, otherwise fall back to hardcoded
  // Filter out past matches (more than 1 day ago) to keep app showing only relevant fixtures
  const isUpcoming = (m) => {
    if (m.backend) return true; // backend data is already filtered to upcoming/recent
    // For hardcoded matches, parse the date string
    if (!m.date) return true;
    const today = new Date();
    today.setHours(0,0,0,0);
    // Try to parse "Sat May 9", "Sun May 10" format
    try {
      const currentYear = today.getFullYear();
      const matchDate = new Date(m.date + " " + currentYear);
      if (isNaN(matchDate.getTime())) return true; // can't parse, keep it
      // Allow today and future, but hide matches more than 1 day old
      const dayDiff = (matchDate - today) / (1000 * 60 * 60 * 24);
      return dayDiff >= -1;
    } catch(e) { return true; }
  };
  const baseMatches = backendFixtures[active] && backendFixtures[active].length > 0 
    ? backendFixtures[active] 
    : (MATCHES[active]||[]).filter(isUpcoming);
  const matches=baseMatches.filter(m=>!search||m.home.toLowerCase().includes(search.toLowerCase())||m.away.toLowerCase().includes(search.toLowerCase()));

  const saveUser=u=>{setUser(u);try{if(u)localStorage.setItem("mm_user",JSON.stringify(u));else localStorage.removeItem("mm_user");}catch{}};
  const saveFav=(teams)=>{setFavTeams(teams);try{localStorage.setItem("mm_fav_teams",JSON.stringify(teams));}catch{}};
  const saveFavL=(lgs)=>{setFavLeagues(lgs);try{localStorage.setItem("mm_fav_leagues",JSON.stringify(lgs));}catch{}};
  const saveSetting=(k,v)=>{const n={...settings,[k]:v};setSettings(n);try{localStorage.setItem("mm_settings",JSON.stringify(n));}catch{}};

  // FIX (Bug E): Hash passwords with SHA-256 before storing
  // This is still not bank-grade security (no server, no salting), but
  // is dramatically safer than plaintext storage in localStorage
  const hashPassword = async (password) => {
    const encoder = new TextEncoder();
    const data = encoder.encode(password + "mm_v1_salt");
    const hashBuffer = await crypto.subtle.digest("SHA-256", data);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
  };

  const doSignup=async ()=>{
    setAuthMsg({err:"",ok:""});
    if(!authName.trim())return setAuthMsg({err:"Enter your name",ok:""});
    if(!authEmail.includes("@"))return setAuthMsg({err:"Enter a valid email",ok:""});
    if(authPass.length<6)return setAuthMsg({err:"Password must be 6+ characters",ok:""});
    const users=JSON.parse(localStorage.getItem("mm_users")||"{}");
    if(users[authEmail])return setAuthMsg({err:"Account already exists. Please sign in.",ok:""});
    const hashedPass = await hashPassword(authPass);
    const u={name:authName,email:authEmail,avatar:"⚽",joined:new Date().toLocaleDateString()};
    users[authEmail]={...u,pass:hashedPass};
    localStorage.setItem("mm_users",JSON.stringify(users));
    saveUser(u);setAuthMode(null);setAuthMsg({err:"",ok:"Welcome to MatchMind, "+authName+"! 🎉"});
    setTimeout(()=>setAuthMsg({err:"",ok:""}),3000);
  };
  const doLogin=async ()=>{
    setAuthMsg({err:"",ok:""});
    const users=JSON.parse(localStorage.getItem("mm_users")||"{}");
    const found=users[authEmail];
    if(!found)return setAuthMsg({err:"No account found",ok:""});
    const hashedInput = await hashPassword(authPass);
    // Migrate legacy plaintext accounts: if stored pass matches plaintext, rehash on next login
    if(found.pass === authPass) {
      // Legacy plaintext password — rehash it
      found.pass = hashedInput;
      users[authEmail] = found;
      localStorage.setItem("mm_users", JSON.stringify(users));
    } else if(found.pass !== hashedInput) {
      return setAuthMsg({err:"Incorrect password",ok:""});
    }
    saveUser({name:found.name,email:found.email,avatar:found.avatar||"⚽",joined:found.joined});
    setAuthMode(null);setAuthMsg({err:"",ok:"Welcome back, "+found.name+"!"});
    setTimeout(()=>setAuthMsg({err:"",ok:""}),3000);
  };

  const toggleFav=(abbr,name)=>{const n=favTeams.find(t=>t.abbr===abbr)?favTeams.filter(t=>t.abbr!==abbr):[...favTeams,{abbr,name}];saveFav(n);};
  const toggleFavL=(id)=>{const n=favLeagues.includes(id)?favLeagues.filter(l=>l!==id):[...favLeagues,id];saveFavL(n);};
  const isFav=abbr=>favTeams.some(t=>t.abbr===abbr);
  const doAgree=()=>{if(!checked)return;try{localStorage.setItem("mm_v2","y");}catch{}setAgreed(true);};
  const doSubscribe=()=>{try{localStorage.setItem("mm_pro","y");}catch{}setIsPro(true);setPaywallOpen(false);};
  const doPick=id=>{if(!canAccess(id)){setPaywallOpen(true);return;}setActive(id);setSearch("");setDrawer(false);ref.current?.scrollTo({top:0,behavior:"smooth"});};
  const doPredict=async(m)=>{
    // Toggle: if prediction already shown, hide it
    if (preds[m.id]) {
      setPreds(p => {
        const next = {...p};
        delete next[m.id];
        return next;
      });
      return;
    }
    if(!canPredict){setPaywallOpen(true);return;}
    const c=predCount+1;setPredCount(c);try{localStorage.setItem("mm_pc",c+"");}catch{}
    setLoading(m.id);
    
    // Fetch real data from backend in parallel: injuries, recent fixtures (fatigue), H2H, weather
    let homeInjuries = [], awayInjuries = [];
    let fatigueText = "", h2hText = "", weatherText = "", stakesText = "";
    let fatigueTag = false, h2hTag = false, weatherTag = false, stakesTag = false;
    // FIX: Track champion status so we can adjust prediction math
    let hIsChampion = false, aIsChampion = false;
    
    if (m.homeTeamId && m.awayTeamId) {
      try {
        const [hi, ai, hRecent, aRecent, h2h, weather, standings] = await Promise.all([
          fetchBackendInjuries(m.homeTeamId),
          fetchBackendInjuries(m.awayTeamId),
          fetchRecentFixtures(m.homeTeamId),
          fetchRecentFixtures(m.awayTeamId),
          fetchH2H(m.homeTeamId, m.awayTeamId),
          fetchWeather(m),
          fetchStandings(LEAGUE_IDS[active])
        ]);
        
        // === INJURIES ===
        // Dedup helper - same player can appear multiple times from API
        const dedupInjuries = (arr) => {
          if (!arr || !Array.isArray(arr)) return [];
          const seen = new Set();
          const result = [];
          for (const inj of arr) {
            const name = inj.player?.name;
            const type = inj.player?.type || inj.player?.reason || "";
            if (!name) continue;
            const key = name.toLowerCase().trim() + "|" + type.toLowerCase().trim();
            if (seen.has(key)) continue;
            seen.add(key);
            result.push(inj);
          }
          return result;
        };
        
        if (hi && Array.isArray(hi)) {
          homeInjuries = dedupInjuries(hi).slice(0, 5).map(inj => {
            const name = inj.player?.name || "Unknown";
            const reason = inj.player?.reason || inj.player?.type || "injury";
            return name + " (" + reason + ")";
          });
        }
        if (ai && Array.isArray(ai)) {
          awayInjuries = dedupInjuries(ai).slice(0, 5).map(inj => {
            const name = inj.player?.name || "Unknown";
            const reason = inj.player?.reason || inj.player?.type || "injury";
            return name + " (" + reason + ")";
          });
        }
        
        // === TRAVEL FATIGUE ===
        const matchDate = new Date();
        const checkFatigue = (recentFixtures, teamName) => {
          if (!recentFixtures || !Array.isArray(recentFixtures) || recentFixtures.length === 0) return null;
          // Find most recent FINISHED match
          const finished = recentFixtures.filter(f => f.fixture?.status?.short === "FT");
          if (finished.length === 0) return null;
          const lastMatch = finished[0];
          const lastDate = new Date(lastMatch.fixture.date);
          const daysDiff = (matchDate - lastDate) / (1000 * 60 * 60 * 24);
          if (daysDiff < 3 && daysDiff > 0) {
            return { days: Math.floor(daysDiff), team: teamName };
          }
          return null;
        };
        const hFatigue = checkFatigue(hRecent, m.home);
        const aFatigue = checkFatigue(aRecent, m.away);
        if (hFatigue && aFatigue) {
          fatigueText = "\n🚌 FATIGUE: Both teams played in last 3 days. Expect lower intensity.";
          fatigueTag = true;
        } else if (hFatigue) {
          fatigueText = "\n🚌 FATIGUE: " + m.home + " played " + hFatigue.days + " day(s) ago. Recovery concern — advantage " + m.away + ".";
          fatigueTag = true;
        } else if (aFatigue) {
          fatigueText = "\n🚌 FATIGUE: " + m.away + " played " + aFatigue.days + " day(s) ago. Recovery concern — advantage " + m.home + ".";
          fatigueTag = true;
        }
        
        // === H2H PSYCHOLOGY ===
        if (h2h && Array.isArray(h2h) && h2h.length >= 3) {
          const last5 = h2h.slice(0, 5);
          let homeWins = 0, awayWins = 0, draws = 0;
          last5.forEach(match => {
            const homeId = match.teams?.home?.id;
            const hG = match.goals?.home, aG = match.goals?.away;
            if (hG === null || aG === null) return;
            if (hG === aG) draws++;
            else if (homeId === m.homeTeamId) {
              if (hG > aG) homeWins++; else awayWins++;
            } else {
              if (hG > aG) awayWins++; else homeWins++;
            }
          });
          if (homeWins >= 4) {
            h2hText = "\n🤝 H2H: " + m.home + " has dominated " + m.away + " (" + homeWins + "W in last 5). Psychological edge.";
            h2hTag = "DOMINANCE";
          } else if (awayWins >= 4) {
            h2hText = "\n😱 BOGEY TEAM: " + m.away + " owns " + m.home + " head-to-head (" + awayWins + "W in last 5). Mental block.";
            h2hTag = "BOGEY";
          } else if (draws >= 3) {
            h2hText = "\n🤝 H2H: Last 5 meetings include " + draws + " draws. Often tight affairs.";
            h2hTag = "TIGHT";
          }
        }
        
        // === SEASON STAKES ===
        // FIX: Skip title-race/champion/relegation logic for cup competitions.
        // UCL, Europa, Conference, World Cup are knockout/group tournaments —
        // their "title" is decided by the final, not by league standings.
        const isCupCompetition = ["ucl", "el", "ecl", "wc"].includes(active);
        if (!isCupCompetition && standings && Array.isArray(standings) && standings.length > 0) {
          const hStanding = standings.find(s => s.team?.id === m.homeTeamId);
          const aStanding = standings.find(s => s.team?.id === m.awayTeamId);
          if (hStanding && aStanding) {
            const total = standings.length;
            const hRank = hStanding.rank;
            const aRank = aStanding.rank;
            const hPts = hStanding.points || 0;
            const aPts = aStanding.points || 0;
            const hGames = hStanding.all?.played || 0;
            const aGames = aStanding.all?.played || 0;
            const totalMatchdays = (total - 1) * 2; // 38 for 20-team league
            const hRemaining = totalMatchdays - hGames;
            const aRemaining = totalMatchdays - aGames;
            const maxRemaining = Math.max(hRemaining, aRemaining);
            
            // Calculate max possible points + actual lead/gap
            const leaderPts = standings[0]?.points || 0;
            const secondPts = standings[1]?.points || 0;
            const secondGames = standings[1]?.all?.played || 0;
            const secondRemaining = totalMatchdays - secondGames;
            const hMaxPossible = hPts + (hRemaining * 3);
            const aMaxPossible = aPts + (aRemaining * 3);
            
            // FIX: Detect if title is already clinched by the leader
            // Title clinched when leader's points > #2's max possible points
            const secondMaxPossible = secondPts + (secondRemaining * 3);
            const titleClinched = leaderPts > secondMaxPossible;
            const hIsLeader = hRank === 1;
            const aIsLeader = aRank === 1;
            hIsChampion = titleClinched && hIsLeader;
            aIsChampion = titleClinched && aIsLeader;
            
            // Title contenders: can mathematically still catch the leader
            // FIX: If title is already clinched, no one else is "in the race"
            const hInTitleRace = !titleClinched && (hRank <= 2 || (hRank <= 4 && hMaxPossible > leaderPts));
            const aInTitleRace = !titleClinched && (aRank <= 2 || (aRank <= 4 && aMaxPossible > leaderPts));
            // Champions League race: typically top 4-5
            const clCutoff = total >= 20 ? 5 : 4;
            const hInCLRace = hRank <= clCutoff + 2 && hRank > 2; // 3rd to ~7th
            const aInCLRace = aRank <= clCutoff + 2 && aRank > 2;
            // Europa race (typically 6-7th)
            const hInEuropaRace = hRank >= clCutoff && hRank <= clCutoff + 3;
            const aInEuropaRace = aRank >= clCutoff && aRank <= clCutoff + 3;
            // Relegation battle (bottom 5 with games left)
            const relegationZone = total - 3; // last 3 relegate
            // FIX: Only flag relegation if team can MATHEMATICALLY still go down
            // A team is "safe" when their points > max possible of all relegation-zone teams
            const relegationCutoffPts = (() => {
              // Find highest possible final points among bottom-zone teams
              let maxRelPts = 0;
              for (let i = relegationZone - 1; i < standings.length; i++) {
                const s = standings[i];
                if (!s) continue;
                const sPts = s.points || 0;
                const sGames = s.all?.played || 0;
                const sRem = totalMatchdays - sGames;
                const sMax = sPts + (sRem * 3);
                if (sMax > maxRelPts) maxRelPts = sMax;
              }
              return maxRelPts;
            })();
            const hSafe = hPts > relegationCutoffPts;
            const aSafe = aPts > relegationCutoffPts;
            const hRelegation = !hSafe && hRank >= relegationZone - 2 && maxRemaining > 0;
            const aRelegation = !aSafe && aRank >= relegationZone - 2 && maxRemaining > 0;
            // Mid-table no stakes
            const hMidTable = !hInTitleRace && !hInCLRace && !hInEuropaRace && !hRelegation && !hIsChampion;
            const aMidTable = !aInTitleRace && !aInCLRace && !aInEuropaRace && !aRelegation && !aIsChampion;
            
            // Priority: highest-stakes scenario wins
            // FIX: Check champions FIRST so already-crowned teams don't get "still fighting"
            if (hIsChampion && aIsChampion) {
              // Impossible but defensive
              stakesText = "\n🏆 CHAMPIONS: Both teams already crowned. Celebration mode.";
              stakesTag = "CHAMPION";
            } else if (hIsChampion) {
              stakesText = "\n🏆 CHAMPIONS: " + m.home + " already won the title. Possible rotation/celebration mode.";
              stakesTag = "CHAMPION";
            } else if (aIsChampion) {
              stakesText = "\n🏆 CHAMPIONS: " + m.away + " already won the title. Possible rotation/celebration mode.";
              stakesTag = "CHAMPION";
            } else if (hRelegation && aRelegation) {
              stakesText = "\n🔥 RELEGATION 6-POINTER: Both teams fighting the drop (#" + hRank + " vs #" + aRank + "). Maximum intensity expected.";
              stakesTag = "REL6";
            } else if (hRelegation) {
              stakesText = "\n🔥 RELEGATION FIGHT: " + m.home + " (#" + hRank + ") fighting to stay up. Plays with desperation.";
              stakesTag = "REL";
            } else if (aRelegation) {
              stakesText = "\n🔥 RELEGATION FIGHT: " + m.away + " (#" + aRank + ") fighting to stay up. Plays with desperation.";
              stakesTag = "REL";
            } else if (hInTitleRace && aInTitleRace) {
              stakesText = "\n👑 TITLE DECIDER: Both teams in genuine title contention. Pivotal match.";
              stakesTag = "TITLE";
            } else if (hInTitleRace) {
              stakesText = "\n👑 TITLE RACE: " + m.home + " (#" + hRank + ") still fighting for the title. Crucial 3 points.";
              stakesTag = "TITLE";
            } else if (aInTitleRace) {
              stakesText = "\n👑 TITLE RACE: " + m.away + " (#" + aRank + ") still fighting for the title. Crucial 3 points.";
              stakesTag = "TITLE";
            } else if (hInCLRace && aInCLRace) {
              stakesText = "\n🏆 UCL QUALIFICATION BATTLE: Both teams fighting for Champions League spots (#" + hRank + " vs #" + aRank + "). High stakes.";
              stakesTag = "UCL";
            } else if (hInCLRace) {
              stakesText = "\n🏆 UCL QUALIFICATION: " + m.home + " (#" + hRank + ") fighting for Champions League. Must-win territory.";
              stakesTag = "UCL";
            } else if (aInCLRace) {
              stakesText = "\n🏆 UCL QUALIFICATION: " + m.away + " (#" + aRank + ") fighting for Champions League. Must-win territory.";
              stakesTag = "UCL";
            } else if (hInEuropaRace || aInEuropaRace) {
              const team = hInEuropaRace ? m.home : m.away;
              const rank = hInEuropaRace ? hRank : aRank;
              stakesText = "\n🥈 EUROPA RACE: " + team + " (#" + rank + ") fighting for European qualification.";
              stakesTag = "EUROPA";
            } else if (hMidTable && aMidTable && maxRemaining <= 5) {
              stakesText = "\n💤 LOW STAKES: Both teams mid-table with nothing to play for. Expect lower intensity.";
              stakesTag = "LOW";
            }
          }
        }
        
        // === WEATHER ===
        if (weather && weather.condition) {
          if (weather.condition === "rain") {
            weatherText = "\n☔ WEATHER: Rain expected (" + weather.temp + "°C). Wet pitch favors direct teams over technical possession play.";
            weatherTag = "RAIN";
          } else if (weather.condition === "wind") {
            weatherText = "\n🌬️ WEATHER: High winds (" + weather.wind + " km/h). Affects long passes and crosses.";
            weatherTag = "WIND";
          } else if (weather.condition === "heat") {
            weatherText = "\n🌡️ WEATHER: High heat (" + weather.temp + "°C). Stamina becomes a factor late.";
            weatherTag = "HEAT";
          } else if (weather.condition === "cold") {
            weatherText = "\n❄️ WEATHER: Cold conditions (" + weather.temp + "°C). May affect ball control.";
            weatherTag = "COLD";
          }
        }
      } catch(e) {
        console.log("Predict factors fetch failed:", e.message);
      }
    }
    
    setTimeout(()=>{
      // FIX: Adjust probabilities for clinched-title teams BEFORE predicting
      // Champions often rotate and play with lower intensity in dead-rubber matches
      // Empirical observation: ~12pp drop in win probability post-clinch
      let adjustedM = m;
      if (hIsChampion || aIsChampion) {
        const CHAMPION_PENALTY = 12; // percentage points
        let nhP = m.hP, naP = m.aP, ndP = m.dP;
        if (hIsChampion && !aIsChampion) {
          // Home is champion playing non-champion: reduce home, boost away + draw
          const reduction = Math.min(CHAMPION_PENALTY, Math.max(0, nhP - 15));
          nhP = nhP - reduction;
          naP = Math.min(naP + Math.round(reduction * 0.6), 70);
          ndP = 100 - nhP - naP;
        } else if (aIsChampion && !hIsChampion) {
          // Away is champion playing non-champion: reduce away, boost home + draw
          const reduction = Math.min(CHAMPION_PENALTY, Math.max(0, naP - 15));
          naP = naP - reduction;
          nhP = Math.min(nhP + Math.round(reduction * 0.6), 70);
          ndP = 100 - nhP - naP;
        }
        // Make sure draw probability stays sane (15-40 range)
        if (ndP < 15) {
          const overflow = 15 - ndP;
          if (nhP > naP) nhP -= overflow; else naP -= overflow;
          ndP = 15;
        }
        adjustedM = { ...m, hP: nhP, aP: naP, dP: ndP };
      }
      const r=predict(adjustedM,["ucl","el","ecl","wc"].includes(active));
      // Add all real-data factors to analysis
      let extraText = "";
      if (homeInjuries.length > 0) extraText += "\n🚑 " + m.home + ": " + homeInjuries.join(", ");
      if (awayInjuries.length > 0) extraText += "\n🚑 " + m.away + ": " + awayInjuries.join(", ");
      if (fatigueText) extraText += fatigueText;
      if (h2hText) extraText += h2hText;
      if (weatherText) extraText += weatherText;
      if (stakesText) extraText += stakesText;
      if (extraText) r.analysis = r.analysis + extraText;
      // Store tags for card display
      r.fatigueTag = fatigueTag;
      r.h2hTag = h2hTag;
      r.weatherTag = weatherTag;
      r.stakesTag = stakesTag;
      // FIX: Store adjusted probabilities so bar display reflects champion penalty
      if (hIsChampion || aIsChampion) {
        r.adjustedHP = adjustedM.hP;
        r.adjustedAP = adjustedM.aP;
        r.adjustedDP = adjustedM.dP;
      }
      setPreds(p=>({...p,[m.id]:r}));
      const entry={id:Date.now(),home:m.home,away:m.away,hA:m.hA,aA:m.aA,fixtureId:m.fixtureId||null,kickoffTime:m.date||null,date:new Date().toLocaleDateString(),prediction:r.winner,score:r.score,conf:r.conf,correct:null};
      const next=[entry,...history].slice(0,50);setHistory(next);try{localStorage.setItem("mm_history",JSON.stringify(next));}catch{}
      setLoading(null);

      {favLeagues.length>0&&(
        <div style={{marginTop:20}}>
          <div style={{fontSize:11,color:"#00ff87",fontWeight:800,letterSpacing:1.5,marginBottom:10}}>QUICK ACCESS</div>
          {favLeagues.map(lid=>{const l=LEAGUES.find(x=>x.id===lid);if(!l)return null;return(
            <button key={lid} onClick={()=>{if(!canAccess(lid)){setPaywallOpen(true);return;}setActive(lid);setTab("home");}} style={{display:"flex",alignItems:"center",gap:12,width:"100%",background:"#111118",border:"1px solid "+l.color+"22",borderRadius:12,padding:"12px 16px",marginBottom:8,cursor:"pointer",textAlign:"left"}}>
              <span style={{fontSize:22}}>{l.flag}</span>
              <div><div style={{fontSize:13,fontWeight:700,color:"#fff"}}>{l.name}</div><div style={{fontSize:11,color:"#555"}}>{(MATCHES[l.id]||[]).length} matches</div></div>
              <span style={{marginLeft:"auto",color:l.color,fontSize:14}}>→</span>
            </button>
          );})}
        </div>
      )}
    </div>
  );

  // ── HISTORY TAB ─────────────────────────────────────────────────────
  const HistTab=()=>{
    const total=history.length,correct=history.filter(h=>h.correct===true).length;
    const acc=total>0?Math.round((correct/total)*100):0;
    const streak=(()=>{let s=0;for(let i=0;i<history.length;i++){if(history[i].correct===true)s++;else break;}return s;})();
    return(
      <div style={{flex:1,overflowY:"auto",padding:"16px 16px 80px"}}>
        <div style={{fontSize:18,fontWeight:900,color:"#fff",marginBottom:4}}>My Predictions</div>
        <div style={{fontSize:12,color:"#555",marginBottom:16}}>Track your prediction record</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:16}}>
          {[{l:"Total",v:total,c:"#00d4ff",i:"🔮"},{l:"Accuracy",v:total>0?acc+"%":"—",c:acc>=55?"#00ff87":acc>=45?"#ffd60a":"#ff6b35",i:"🎯"},{l:"Streak",v:streak>0?streak+"🔥":"—",c:"#ffd60a",i:"⚡"}].map(s=>(
            <div key={s.l} style={{background:"#111118",border:"1px solid "+s.c+"22",borderRadius:12,padding:"14px 8px",textAlign:"center"}}>
              <div style={{fontSize:18}}>{s.i}</div>
              <div style={{fontSize:20,fontWeight:900,color:s.c,margin:"4px 0"}}>{s.v}</div>
              <div style={{fontSize:9,color:"#555",letterSpacing:1}}>{s.l.toUpperCase()}</div>
            </div>
          ))}
        </div>
        {history.length > 0 && history.some(h => h.correct === null) && (
          <div style={{marginBottom:14}}>
            <button onClick={()=>checkPendingResults(true)} disabled={checkingResults} style={{width:"100%",background:checkingResults?"#1a1a2e":"#111118",border:"1px solid "+(checkingResults?"#00ff8722":"#00ff8744"),borderRadius:10,padding:"10px 16px",fontSize:12,color:"#00ff87",fontWeight:700,cursor:checkingResults?"wait":"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
              {checkingResults ? "Checking results..." : "🔄 Refresh Results"}
            </button>
            {lastCheckMsg && <div style={{fontSize:10,color:"#00ff87",textAlign:"center",marginTop:6}}>{lastCheckMsg}</div>}
          </div>
        )}
        {history.length===0?(
          <div style={{background:"#111118",border:"1px solid #ffffff08",borderRadius:14,padding:"40px 20px",textAlign:"center"}}>
            <div style={{fontSize:40,marginBottom:12}}>🔮</div>
            <div style={{fontSize:13,color:"#555"}}>No predictions yet</div>
            <div style={{fontSize:11,color:"#444",marginTop:4}}>Tap Predict on any match to start</div>
          </div>
        ):(
          <>
            {history.map(h=>(
              <div key={h.id} style={{background:"#111118",border:"1px solid "+(h.correct===true?"#00ff8722":h.correct===false?"#ff444422":"#ffffff08"),borderRadius:12,padding:"12px 14px",marginBottom:8,display:"flex",alignItems:"center",gap:12}}>
                <div style={{fontSize:20,flexShrink:0}}>{h.correct===true?"✅":h.correct===false?"❌":"🔮"}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:12,fontWeight:700,color:"#e0e0ee",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{h.home} vs {h.away}</div>
                  <div style={{fontSize:11,color:"#666",marginTop:2}}>Predicted: <span style={{color:"#00d4ff"}}>{h.prediction}</span> · {h.conf}</div>
                </div>
                <div style={{textAlign:"right",flexShrink:0}}>
                  <div style={{fontSize:11,color:"#555"}}>{h.date}</div>
                  <div style={{fontSize:10,color:"#444",marginTop:2}}>{h.correct===null?"Pending":"—"}</div>
                </div>
              </div>
            ))}
            <button onClick={()=>{setHistory([]);try{localStorage.removeItem("mm_history");}catch{}}} style={{display:"block",margin:"12px auto 0",background:"transparent",border:"1px solid #ff444433",borderRadius:8,padding:"7px 18px",fontSize:11,color:"#ff4444",cursor:"pointer"}}>Clear History</button>
          </>
        )}
      </div>
    );
  };

  return(
    <div style={{height:"100dvh",background:"#08080f",color:"#fff",fontFamily:"system-ui,sans-serif",display:"flex",flexDirection:"column",overflow:"hidden",maxWidth:480,margin:"0 auto",position:"relative"}}>
      <style>{"@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:#222;border-radius:3px}input::placeholder{color:#444}select option{background:#111118}"}</style>
      <div style={{background:"#08080f",borderBottom:"1px solid #ffffff09",padding:"12px 16px 0",flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{width:40,height:40,borderRadius:11,background:"linear-gradient(135deg,#1e3a5f,#0a0a14)",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 0 18px #4a90e228",flexShrink:0}}>
              <svg width="28" height="28" viewBox="0 0 120 120" fill="none">
                <defs>
                  <linearGradient id="hPlatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stopColor="#e5e4e2"/>
                    <stop offset="100%" stopColor="#a8a8a8"/>
                  </linearGradient>
                  <linearGradient id="hBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stopColor="#4a90e2"/>
                    <stop offset="100%" stopColor="#2c5282"/>
                  </linearGradient>
                </defs>
                <circle cx="60" cy="60" r="55" fill="none" stroke="url(#hPlatGrad)" strokeWidth="1.5"/>
                <circle cx="60" cy="60" r="38" fill="url(#hBlueGrad)"/>
                <polygon points="60,42 73,52 68,68 52,68 47,52" fill="url(#hPlatGrad)"/>
                <polygon points="60,28 65,35 60,40 55,35" fill="url(#hPlatGrad)" opacity="0.7"/>
                <polygon points="85,55 90,62 85,68 80,62" fill="url(#hPlatGrad)" opacity="0.7"/>
                <polygon points="74,80 78,86 74,90 70,86" fill="url(#hPlatGrad)" opacity="0.7"/>
                <polygon points="46,80 50,86 46,90 42,86" fill="url(#hPlatGrad)" opacity="0.7"/>
                <polygon points="35,55 40,62 35,68 30,62" fill="url(#hPlatGrad)" opacity="0.7"/>
              </svg>
            </div>
            <div>
              <div style={{fontFamily:"monospace",fontSize:17,fontWeight:900,background:"linear-gradient(90deg,#e5e4e2,#4a90e2)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",letterSpacing:-0.3}}>MatchMind</div>
              <div style={{fontSize:8,color:"#444",letterSpacing:2,textTransform:"uppercase"}}>Beyond stats. Beyond luck.</div>
            </div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:7}}>
            {isPro?<div style={{background:"linear-gradient(90deg,#00ff87,#00d4ff)",borderRadius:20,padding:"3px 10px",fontSize:10,fontWeight:900,color:"#000"}}>PRO</div>
            :inTrial?<div onClick={()=>setPaywallOpen(true)} style={{background:"#ffd60a18",border:"1px solid #ffd60a40",borderRadius:20,padding:"3px 10px",fontSize:10,fontWeight:800,color:"#ffd60a",cursor:"pointer"}}>{trialDays}d trial</div>
            :<div onClick={()=>setPaywallOpen(true)} style={{background:"linear-gradient(90deg,#00ff87,#00d4ff)",borderRadius:20,padding:"3px 10px",fontSize:10,fontWeight:900,color:"#000",cursor:"pointer"}}>Go Pro</div>}
            <div style={{display:"flex",alignItems:"center",gap:3}}><div style={{width:6,height:6,borderRadius:"50%",background:"#00ff87",animation:"pulse 2s infinite"}}/><span style={{fontSize:9,color:"#00ff87",fontWeight:700}}>LIVE</span></div>
            <button onClick={()=>setDrawer(true)} style={{background:"#ffffff0c",border:"1px solid #ffffff12",borderRadius:8,width:32,height:32,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:4,cursor:"pointer",flexShrink:0}}>
              {[0,1,2].map(i=><div key={i} style={{width:12,height:1.5,background:"#888",borderRadius:2}}/>)}
            </button>
          </div>
        </div>
        {tab==="home"&&(
          <>
            <div style={{display:"flex",alignItems:"center",gap:10,background:league.color+"18",border:"1px solid "+league.color+"33",borderRadius:12,padding:"7px 12px",marginBottom:10}}>
              <span style={{fontSize:18}}>{league.flag}</span>
              <div><div style={{fontSize:13,fontWeight:800}}>{league.name}</div><div style={{fontSize:10,color:"#666"}}>{matches.length===1?"1 match":matches.length+" matches"}</div></div>
              <button onClick={()=>setDrawer(true)} style={{marginLeft:"auto",background:"#ffffff0c",border:"1px solid #ffffff15",borderRadius:8,padding:"4px 10px",fontSize:11,color:"#aaa",cursor:"pointer"}}>Switch ›</button>
            </div>
            <div style={{position:"relative",marginBottom:10}}>
              <span style={{position:"absolute",left:11,top:"50%",transform:"translateY(-50%)",color:"#444",fontSize:13}}>🔍</span>
              <input placeholder="Search teams..." value={search} onChange={e=>setSearch(e.target.value)} style={{width:"100%",background:"#ffffff07",border:"1px solid #ffffff10",borderRadius:10,padding:"8px 12px 8px 32px",color:"#fff",fontSize:13,outline:"none"}}/>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:6,fontSize:9,color:"#444",marginBottom:4}}>
              <span style={{width:5,height:5,borderRadius:"50%",background:backendFixtures[active]?"#00ff87":"#ffd60a",animation:backendLoading?"pulse 1s infinite":"none"}}/>
              <span>{backendLoading?"Fetching live data...":backendFixtures[active]?"Live data · 3-year AI training · Auto-updated":"Cached data · "+DATA_UPDATED}</span>
            </div>
          </>
        )}
      </div>

      {tab==="home"&&<div ref={ref} style={{flex:1,overflowY:"auto",padding:"10px 14px 80px"}}>
        {/* TODAY'S TOP 3 PICKS BANNER */}
        {(()=>{const top3=getTop3Picks(active, backendFixtures);if(top3.length===0)return null;return(
          <div style={{background:"linear-gradient(135deg,#00ff8718,#00d4ff18)",border:"1px solid #00ff8733",borderRadius:14,padding:"12px 14px",marginBottom:14}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
              <div style={{display:"flex",alignItems:"center",gap:6}}>
                <span style={{fontSize:14}}>🎯</span>
                <span style={{fontSize:11,fontWeight:900,color:"#00ff87",letterSpacing:1}}>TOP 3 PICKS TODAY</span>
              </div>
              <span style={{fontSize:9,color:"#555"}}>{"Updated "+new Date().toLocaleDateString("en-US",{month:"short",day:"numeric"})}</span>
            </div>
            {top3.map((p,i)=>{const lg=LEAGUES.find(l=>l.id===p.leagueId);const max=Math.max(p.hP,p.aP);const winner=p.hP>p.aP?p.home:p.away;return(
              <div key={p.id} onClick={()=>{setActive(p.leagueId);setSearch("");}} style={{display:"flex",alignItems:"center",gap:10,padding:"8px",cursor:"pointer",borderRadius:8,background:i===0?"#00ff870a":"transparent",marginBottom:i<2?4:0}}>
                <div style={{fontSize:14,fontWeight:900,color:i===0?"#00ff87":i===1?"#ffd60a":"#888",minWidth:18}}>{i+1}.</div>
                <span style={{fontSize:14}}>{lg?lg.flag:"⚽"}</span>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:11,fontWeight:700,color:"#e0e0ee",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{winner.split(" ").slice(0,2).join(" ")} favored</div>
                  <div style={{fontSize:9,color:"#666"}}>{p.home.split(" ")[0]} vs {p.away.split(" ")[0]} · {p.date}</div>
                </div>
                <div style={{textAlign:"right",flexShrink:0}}>
                  <div style={{fontSize:13,fontWeight:900,color:"#00ff87"}}>{max}%</div>
                  <div style={{fontSize:8,color:"#555",letterSpacing:1}}>CONF</div>
                </div>
              </div>
            );})}
          </div>
        );})()}
        {matches.length===0?<div style={{textAlign:"center",color:"#444",padding:"60px 0",fontSize:14}}>No matches found</div>:matches.map(m=><Card key={m.id} m={m} onPredict={doPredict} pred={preds[m.id]} loading={loading} lid={active} onFav={toggleFav} isFav={isFav}/>)}
      </div>}
      {tab==="favorites"&&<FavTab/>}
      {tab==="history"&&<HistTab/>}
      {tab==="profile"&&<ProfileTab/>}

      {tab==="home"&&(
        <div style={{position:"absolute",bottom:52,left:0,right:0,background:"linear-gradient(to top,#08080f 85%,transparent)",padding:"8px 0 4px"}}>
          <div style={{display:"flex",gap:5,overflowX:"auto",padding:"0 14px",scrollbarWidth:"none"}}>
            {LEAGUES.map(l=>(
              <button key={l.id} onClick={()=>doPick(l.id)} style={{background:active===l.id?l.color+"33":"#ffffff08",border:"1px solid "+(active===l.id?l.color:"#ffffff10"),borderRadius:20,padding:"5px 11px",fontSize:10,color:active===l.id?"#fff":"#666",cursor:"pointer",whiteSpace:"nowrap",fontWeight:active===l.id?800:400,flexShrink:0}}>
                {l.flag} {l.id.toUpperCase()}{!canAccess(l.id)?" 🔒":""}
              </button>
            ))}
          </div>
        </div>
      )}

      <div style={{position:"absolute",bottom:0,left:0,right:0,background:"#0d0d1a",borderTop:"1px solid #ffffff0f",height:52,display:"flex",alignItems:"center",zIndex:60}}>
        {[{id:"home",icon:"⚽",label:"Matches"},{id:"favorites",icon:"⭐",label:"Favorites"},{id:"history",icon:"📊",label:"My Picks"},{id:"profile",icon:user?user.avatar:"👤",label:user?user.name.split(" ")[0]:"Profile"}].map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:2,background:"none",border:"none",cursor:"pointer",padding:"4px 0"}}>
            <span style={{fontSize:tab===t.id?19:16}}>{t.icon}</span>
            <span style={{fontSize:9,color:tab===t.id?"#00ff87":"#444",fontWeight:tab===t.id?800:400}}>{t.label}</span>
            {tab===t.id&&<div style={{width:14,height:2,background:"#00ff87",borderRadius:1}}/>}
          </button>
        ))}
      </div>

      {paywallOpen&&(
        <div style={{position:"fixed",inset:0,zIndex:300,background:"#000000ee",backdropFilter:"blur(8px)",display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
          <div style={{width:"100%",maxWidth:480,background:"linear-gradient(180deg,#0d0d1a,#08080f)",borderRadius:"26px 26px 0 0",padding:"0 0 36px"}}>
            <div style={{width:"100%",height:3,background:"linear-gradient(90deg,transparent,#00ff87,transparent)",borderRadius:"3px 3px 0 0"}}/>
            <div style={{padding:"20px 22px 0",textAlign:"center"}}>
              <div style={{fontSize:30,marginBottom:5}}>🏆</div>
              <div style={{fontFamily:"monospace",fontSize:19,fontWeight:900,background:"linear-gradient(90deg,#00ff87,#00d4ff)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",marginBottom:4}}>MatchMind Pro</div>
              <div style={{fontSize:12,color:"#666",marginBottom:14}}>{inTrial?"Trial: "+trialDays+" days left":"Your 7-day trial has ended"}</div>
            </div>
            <div style={{padding:"0 22px"}}>
              {["All 13 leagues + World Cup 2026","Unlimited AI predictions","14-factor deep analysis","Rotation risk intelligence","No ads ever"].map((f,i)=>(
                <div key={i} style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
                  <span style={{color:"#00ff87",fontSize:13}}>✓</span><span style={{fontSize:13,color:"#bbb"}}>{f}</span>
                </div>
              ))}
            </div>
            <div style={{padding:"14px 22px 0",display:"flex",gap:10}}>
              {[{id:"annual",l:"Best Value",p:"$29.99",per:"/year",s:"Save 50%",best:true},{id:"monthly",l:"Monthly",p:"$4.99",per:"/month",s:"Cancel anytime",best:false}].map(p=>(
                <div key={p.id} onClick={()=>setPlan(p.id)} style={{flex:1,border:"2px solid "+(plan===p.id?"#00ff87":"#ffffff15"),borderRadius:13,padding:"11px 8px",textAlign:"center",cursor:"pointer",background:plan===p.id?"#00ff8710":"#ffffff05",position:"relative"}}>
                  {p.best&&<div style={{position:"absolute",top:-9,left:"50%",transform:"translateX(-50%)",background:"linear-gradient(90deg,#00ff87,#00d4ff)",color:"#000",fontSize:9,fontWeight:900,padding:"2px 8px",borderRadius:20,whiteSpace:"nowrap"}}>BEST VALUE</div>}
                  <div style={{fontSize:9,color:"#666",letterSpacing:1,textTransform:"uppercase",marginBottom:3}}>{p.l}</div>
                  <div style={{fontSize:21,fontWeight:900,color:"#fff"}}>{p.p}</div>
                  <div style={{fontSize:10,color:"#555"}}>{p.per}</div>
                  <div style={{fontSize:9,color:"#00ff87",marginTop:2}}>{p.s}</div>
                </div>
              ))}
            </div>
            <div style={{padding:"13px 22px 0"}}>
              <button onClick={doSubscribe} style={{width:"100%",background:"linear-gradient(135deg,#00ff87,#00d4ff)",color:"#000",border:"none",borderRadius:12,padding:"14px",fontSize:14,fontWeight:900,cursor:"pointer",boxShadow:"0 4px 20px #00ff8750"}}>{plan==="annual"?"Start Pro — $29.99/year":"Start Pro — $4.99/month"}</button>
              {inTrial&&<button onClick={()=>setPaywallOpen(false)} style={{display:"block",width:"100%",marginTop:8,background:"transparent",border:"1px solid #ffffff10",borderRadius:10,padding:"10px",fontSize:12,color:"#555",cursor:"pointer"}}>Continue {trialDays}-day trial</button>}

              <div style={{textAlign:"center",marginTop:10,fontSize:10,color:"#333",lineHeight:1.7}}>Billed via App Store or Google Play · Cancel anytime<br/><span style={{color:"#ff6b35"}}>For entertainment only · Not gambling advice</span></div>
              {inTrial&&<button onClick={()=>setPaywallOpen(false)} style={{display:"block",margin:"8px auto 0",background:"none",border:"none",color:"#333",fontSize:12,cursor:"pointer"}}>Maybe later</button>}
            </div>
          </div>
        </div>
      )}

      {drawer&&(
        <div style={{position:"absolute",inset:0,zIndex:100}}>
          <div onClick={()=>setDrawer(false)} style={{position:"absolute",inset:0,background:"#000000bb",backdropFilter:"blur(4px)"}}/>
          <div style={{position:"absolute",bottom:0,left:0,right:0,background:"#111118",borderRadius:"20px 20px 0 0",padding:"0 0 40px",animation:"slideUp .3s cubic-bezier(.4,0,.2,1)",maxHeight:"85vh",overflowY:"auto"}}>
            <div style={{display:"flex",justifyContent:"center",padding:"12px 0 6px"}}><div style={{width:40,height:4,background:"#333",borderRadius:2}}/></div>
            <div style={{padding:"8px 20px 14px",fontSize:16,fontWeight:800}}>Select League</div>
            {LEAGUES.map(l=>(
              <button key={l.id} onClick={()=>doPick(l.id)} style={{display:"flex",alignItems:"center",gap:14,width:"100%",background:active===l.id?l.color+"18":"transparent",border:"none",borderLeft:active===l.id?"3px solid "+l.color:"3px solid transparent",padding:"13px 20px",cursor:"pointer",textAlign:"left"}}>
                <span style={{fontSize:22}}>{l.flag}</span>
                <div><div style={{fontSize:14,fontWeight:700,color:active===l.id?"#fff":"#aaa"}}>{l.name}</div><div style={{fontSize:11,color:"#555"}}>{(MATCHES[l.id]||[]).length} matches</div></div>
                {!canAccess(l.id)&&<span style={{marginLeft:"auto",fontSize:11,color:"#555"}}>🔒 Pro</span>}
                {active===l.id&&canAccess(l.id)&&<span style={{marginLeft:"auto",color:l.color,fontSize:16}}>✓</span>}
              </button>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}


const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(MatchMind));
</script>
</body>
</html>
