<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#08080f"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <title>MatchMind</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body,#root{height:100%;width:100%;background:#08080f;overflow:hidden;}
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React 18 -->
  <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>

  <!-- Babel to compile JSX -->
  <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>

  <!-- Load and run the app -->
  <script type="text/babel" data-presets="react,es2015">
    // Make hooks available globally
    const { useState, useRef, useEffect } = React;
  </script>

  <script type="text/babel" data-presets="react,es2015" src="./matchmind.jsx"></script>

  <script type="text/babel" data-presets="react,es2015">
    try {
      const container = document.getElementById('root');
      const root = ReactDOM.createRoot(container);
      root.render(React.createElement(MatchMind));
    } catch(e) {
      document.getElementById('root').innerHTML =
        '<div style="color:#ff4444;padding:40px;font-family:monospace;background:#08080f;min-height:100vh;">' +
        '<h2>Error loading app</h2><pre>' + e.message + '</pre></div>';
    }
  </script>
</body>
</html>
